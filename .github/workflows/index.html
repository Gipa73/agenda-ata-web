<html lang="it">
<head>

<style>

:root[data-theme="dark"]{--bg:#10141b;--card:#1a212c;--tx:#e8ecf3;--mu:#98a2b3;--pr:#6b95ff;--ok:#43c47a;--ko:#f06b6b;--bl:#5aa0f5;--bd:#2a3342}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:76px}

h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 4px 14px #7c5cff12}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:26px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.ok{color:var(--ok)}.ko{color:var(--ko)}.bl{color:var(--bl)}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--gr);color:#fff;border:0;border-radius:16px;padding:12px 14px;font-weight:700;width:100%}

label{font-size:13px;color:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}

nav button.on{color:var(--pr);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:12px;color:var(--mu)}
.d{aspect-ratio:1;border-radius:10px;border:1px solid var(--bd);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;padding:0;color:var(--tx);font-weight:500;width:100%}
.d small{font-size:9px}.d.g{background:color-mix(in srgb,var(--ok) 25%,transparent)}.d.r{background:color-mix(in srgb,var(--ko) 25%,transparent)}.d.b{background:color-mix(in srgb,var(--bl) 25%,transparent)}.d.t{outline:2px solid var(--pr)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--bd)}.bar i{display:block;height:100%;background:var(--pr)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:20}
.modal>div{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px;max-height:88%;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.pr{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
textarea{width:100%;height:110px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px;font:12px monospace}
body{background:linear-gradient(180deg,color-mix(in srgb,#ff7ab8 22%,transparent),transparent 260px),var(--bg);font-family:ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif}
h1{font-weight:800}
.hero{display:flex;gap:14px;align-items:center;background:var(--gr);color:#fff;border-radius:26px;padding:18px;margin-bottom:14px;box-shadow:0 10px 24px #7c5cff44}
.hero .em{font-size:46px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
.hi{font-size:21px;font-weight:800}.mu2{opacity:.94;font-size:14px}
.cta{padding:17px;font-size:18px;border-radius:22px;box-shadow:0 6px 16px #7c5cff55}
.ring{width:150px;height:150px;border-radius:50%;margin:6px auto 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(closest-side,var(--card) 76%,transparent 78%),conic-gradient(#7c5cff calc(var(--p)*1%),var(--bg) 0)}
.ring b{font-size:36px}.ring small{color:var(--mu)}
nav{border-radius:24px 24px 0 0;box-shadow:0 -6px 20px #7c5cff18}
nav button span{display:block;font-size:22px;transition:transform .2s}nav button.on span{transform:scale(1.25)}
.d{border-radius:14px}.d.t{outline:3px solid #ff7ab8}.d.f{background:#e11d2e;border-color:#e11d2e;color:#fff;font-weight:700}.d.f small{color:#fff}.d.b{background:color-mix(in srgb,var(--c,#3b8cf0) 32%,transparent)}.d.f{background:#e11d2e}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:3px 9px}.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}.ti{display:flex;align-items:center;gap:10px}.ti svg{color:var(--pr);width:28px;height:28px}nav button svg{display:block;margin:0 auto 2px}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main.anim>*{animation:fin .3s ease both}
main.anim>*:nth-child(2){animation-delay:.04s}main.anim>*:nth-child(3){animation-delay:.08s}main.anim>*:nth-child(4){animation-delay:.12s}
@keyframes ringin{from{stroke-dasharray:0 400}}
.rg{animation:ringin .9s ease-out}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
nav button.on svg{animation:pop .3s ease}
@media (prefers-reduced-motion:reduce){main.anim>*,.rg,nav button.on svg{animation:none}}
#inst{position:fixed;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:0 8px 24px #0003;font-size:13px;line-height:1.4}#inst button{margin-top:8px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const TIPI={presenza:'Presenza',ferie:'Ferie',fest:'Festività soppressa',permesso:'Permesso retribuito',malattia:'Malattia',recupero:'Recupero (banca ore)',chiusura:'Chiusura prefestiva',fam:'Ferie motivi familiari',p104:'Permesso L. 104',p104h:'Permesso L. 104 a ore',assemblea:'Assemblea sindacale',formazione:'Formazione / corso sicurezza',pbreve:'Permesso breve (da recuperare)',maternita:'Congedo di maternità',paternita:'Congedo di paternità',malfiglio:'Malattia del figlio',adozione:'Congedo adozione / affidamento',riposi:'Riposi giornalieri (allattamento)',lutto:'Permesso per lutto',matrimonio:'Congedo matrimoniale',concorsi:'Permesso concorsi / esami',violenza:'Congedo vittime di violenza',biennale:'Congedo biennale assistenza disabili',aspettativa:'Aspettativa motivi familiari (non retribuita)',cong:'Congedo parentale'};
const GG=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
let P=null,E={},view='home',cur=new Date(),sel=null,note='';
function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
P=ld('ata_p',null);E=ld('ata_e',{});
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const tm=s=>{const[a,b,c]=s.split(':').map(Number);return a*60+b+(c||0)/60};
const ns=s=>s&&s.length===5?s+':00':(s||'');
function fm(m,sh){const s=m<0?'−':(m>0?'+':'');let t=Math.abs(Math.round(m*60));if(sh)t=Math.round(t/60)*60;return s+Math.floor(t/3600)+'h '+pad(Math.floor(t%3600/60))+'m'+(sh?'':' '+pad(t%60)+'s')}
function fh(m){const t=Math.round(m*60);return Math.floor(t/3600)+'h '+pad(Math.floor(t%3600/60))+'m '+pad(t%60)+'s'}
function pasqua(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),gi=(h+l-7*m+114)%31+1;return new Date(y,mo-1,gi)}
function fest(d){const F={'1-1':'Capodanno','6-1':'Epifania','25-4':'Festa della Liberazione','1-5':'Festa del Lavoro','2-6':'Festa della Repubblica','15-8':'Ferragosto','1-11':'Ognissanti','8-12':'Immacolata','25-12':'Natale','26-12':'Santo Stefano'},p=pasqua(d.getFullYear()),l=new Date(d.getFullYear(),p.getMonth(),p.getDate()+1);if(d.getMonth()===l.getMonth()&&d.getDate()===l.getDate())return 'Lunedì dell’Angelo';if(d.getFullYear()>=2026&&d.getDate()===4&&d.getMonth()===9)return 'San Francesco d’Assisi';return F[d.getDate()+'-'+(d.getMonth()+1)]||null}
function usc(){const t=new Date(),e=E[key(t)]||{},ps=e.p||[],x=exp(t);if(!x||!ps.length||ps[ps.length-1][1]||(e.t&&e.t!=='presenza'))return '';const chiusi=ps.slice(0,-1).reduce((a,q)=>q[1]?a+(tm(q[1])-tm(q[0])):a,0),fine=tm(ps[ps.length-1][0])+x-chiusi,b=sumMonth(t.getFullYear(),t.getMonth())-(bal(t)||0),zero=fine-b;const hm=m=>{m=((m%1440)+1440)%1440;const s=Math.round(m*60);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};return '<div style="margin-bottom:10px;font-weight:700">🚪 Per completare '+fh(x)+' esci alle '+hm(fine)+'</div>'+(Math.abs(zero-fine)>1?'<div class="mu" style="margin-bottom:10px">⚖️ Per azzerare il saldo del mese esci alle '+hm(zero)+'</div>':'')}
function anom(y,m){const o=[],t=new Date(),n=new Date(y,m+1,0).getDate(),primo=Object.keys(E).filter(k=>/^\d{4}-/.test(k)).sort()[0];for(let i=1;i<=n;i++){const d=new Date(y,m,i);if(d>t)break;const et=pad(i)+'/'+pad(m+1),e=E[key(d)];if(!e){if(exp(d)&&primo&&key(d)>=primo&&key(d)!==key(t))o.push(et+': nessuna timbratura né assenza');continue}if(e.t==='presenza'||e.t==='p104h'){const p=e.p||[];if(e.t==='presenza'&&!p.length)o.push(et+': presenza senza orari');if(p.some(q=>!q[1])&&key(d)!==key(t))o.push(et+': uscita mancante');if(p.some(q=>q[1]&&tm(q[1])<=tm(q[0])))o.push(et+': uscita precedente all’entrata');if(worked(e)>720)o.push(et+': oltre 12 ore lavorate, controlla')}}return '<div class="card">'+(o.length?'<b>⚠️ Da controllare ('+o.length+')</b>'+o.slice(0,12).map(x=>'<div class="mu">• '+x+'</div>').join(''):'✅ Nessuna anomalia in questo mese')+'</div>'}
function tipoUi(v){const sh=(id,on)=>{const e=document.getElementById(id);if(e)e.style.display=on?'':'none'};sh('bx_ore',v!=='pers');sh('bx_sett',v==='pieno'||v==='orizz');sh('bx_vert',v==='vert');sh('bx_pers',v==='pers')}
function exp(d){if(!P)return 0;const w=d.getDay();if(w===0||fest(d))return 0;if(P.tipoOrario==='pers')return Math.round((+(P.oreGiorno||[])[w-1]||0)*60);if(P.tipoOrario==='vert'){const g=P.giorniLav&&P.giorniLav.length?P.giorniLav:[1,2,3,4,5];return g.includes(w)?Math.round(P.ore*60/g.length):0}if(P.giorni==5&&w===6)return 0;return Math.round(P.ore*60/P.giorni)}
function worked(e){let t=0;(e&&e.p||[]).forEach(x=>{if(x[0]&&x[1]){const v=tm(x[1])-tm(x[0]);if(v>0)t+=v}});return t}
function bal(d){const e=E[key(d)],x=exp(d);if(!e)return null;
 if(e.t==='recupero')return -x;
 if(e.t==='p104h')return e.p&&e.p.length?worked(e)+(e.hr||0)*60-x:null;
 if(e.t==='assemblea'){if(e.d==='fuori')return e.p&&e.p.length?worked(e)-x:0;return(e.p&&e.p.length)||e.hr?worked(e)+(e.hr||0)*60-x:null}
 if(e.t==='formazione'||e.t==='riposi')return(e.p&&e.p.length)||e.hr?worked(e)+(e.hr||0)*60-x:null;
 if(e.t==='pbreve')return e.p&&e.p.length?worked(e)-x:null;
 if(e.t&&e.t!=='presenza')return 0;
 if(!e.p||!e.p.length)return null;
 return worked(e)-x}
function sumMonth(y,m){let s=0,n=new Date(y,m+1,0).getDate();for(let i=1;i<=n;i++){const b=bal(new Date(y,m,i));if(b!==null)s+=b}return s}
function sumAll(){let s=0;Object.keys(E).forEach(k=>{const[y,m,d]=k.split('-').map(Number);const b=bal(new Date(y,m-1,d));if(b!==null)s+=b});return s}
function gg(x){return String(Math.ceil(x-.5-1e-4))}
function fat(){return(((P.tipoOrario||'pieno')==='pieno'||P.tipoOrario==='orizz')&&P.giorni==5)?1.2:1}
function prop(){if(P.tipoOrario==='vert')return Math.min(6,Math.max(1,(P.giorniLav&&P.giorniLav.length)||5))/6;if(P.tipoOrario==='pers')return Math.min(6,Math.max(1,(P.oreGiorno||[]).filter(x=>+x>0).length||5))/6;return 1}
function num(x){return Math.abs(x-Math.round(x))<.001?String(Math.round(x)):x.toFixed(1)}
function ferieSpet(){const fs=Math.round((P.festSopp!=null&&P.festSopp!==''?+P.festSopp:3)*prop());if(P.ferieMan!=null&&P.ferieMan!==''&&+P.ferieMan>=0)return{ferie:+P.ferieMan,fest:fs};const base=P.anz=='lt3'?30:32;return{ferie:Math.round(base*prop()*mesiServ()/12),fest:fs}}
function godute(t,y){return Object.keys(E).filter(k=>k.startsWith(y+'-')&&E[k].t===t).length}
function h(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function setView(v){view=v;render()}
function render(){
 applyTema();const a=document.getElementById('app'),n=document.getElementById('nav');
 if(!P){n.style.display='none';a.innerHTML=prof(true);return}
 n.style.display='flex';
 n.innerHTML=[['home',IC.home,'Home'],['ag',IC.cal,'Agenda'],['fe',IC.sun,'Ferie'],['re',IC.doc,'Report'],['pr',IC.gear,'Profilo']].map(x=>`<button class="${view===x[0]?'on':''}" onclick="setView('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');
 a.innerHTML=(!P.guida?guida():{home,ag,fe,re,pr:()=>prof(false),at}[view]());if(view!==window._lv){window._lv=view;a.classList.remove('anim');void a.offsetWidth;a.classList.add('anim');animNum()}
}
function home(){
 const t=new Date(),k=key(t),e=E[k]||{},x=exp(t),w=worked(e),ps=(e.p||[]),open=ps.length&&!ps[ps.length-1][1];
 return `<div class="hero"><div class="em">${greet()[0]}</div><div><div class="hi">${greet()[1]}, ${h(P.nome)}!</div><div class="mu2">${msg()}</div></div></div>${banner()?`<div class="card" style="border-color:#ff7ab8;font-weight:700">${banner()}</div>`:''}
 <div class="card"><div class="mu">Oggi · ${GG[t.getDay()]} ${t.getDate()} ${MESI[t.getMonth()]}</div>
 ${ringHtml(view!==window._lv)}
 <div class="mu" style="margin-bottom:10px">${ps.map(p=>p[0]+'–'+(p[1]||'…')).join(' · ')||'Nessuna timbratura'}${e.t&&e.t!=='presenza'?' · '+TIPI[e.t]:''}</div>
 ${usc()}<button class="cta" onclick="timbra()">${open?'👋 Timbra uscita':'☀️ Timbra ingresso'}</button></div>
 <div class="grid2"><div class="card"><div class="mu">⏱️ Saldo del mese</div>${sv2(sumMonth(t.getFullYear(),t.getMonth()))}</div>
 <div class="card"><div class="mu">🏦 Banca ore totale</div>${sv2(sumAll())}</div></div>
 ${atCard()}${credHtml()}<div class="card"><div class="mu">🏖️ Ferie rimanenti ${t.getFullYear()}</div><div class="big">${gg(ferieRim()/fat())} giorni</div>${fat()>1?'<div class="mu">monte ferie: '+num(ferieRim())+' (ogni giorno scala 1,2)</div>':''}</div>`
}
function sv2(m){return `<div class="big ${m>0?'ok':m<0?'ko':''}" data-v="${m}">${fm(m)}</div>`}
function contrUi(v){const e=document.getElementById('bx_det');if(e)e.style.display=v==='det'?'':'none'}
function dIso(s){return s?new Date(s+'T00:00:00'):null}
function fineC(){if(P.contratto!=='det'||!P.inizioC)return null;const i=dIso(P.inizioC);if(P.scadC==='altra')return P.fineC?dIso(P.fineC):null;if(P.scadC==='31ago')return new Date(i.getMonth()+1>8?i.getFullYear()+1:i.getFullYear(),7,31);return new Date(i.getMonth()+1>6?i.getFullYear()+1:i.getFullYear(),5,30)}
function mesiServ(){const man=Math.min(12,Math.max(1,+P.mesiAnno||12)),f=fineC();if(!f)return man;const i=dIso(P.inizioC);if(f<i)return man;const e=new Date(f.getFullYear(),f.getMonth(),f.getDate()+1);let m=(e.getFullYear()-i.getFullYear())*12+(e.getMonth()-i.getMonth()),d=e.getDate()-i.getDate();if(d<0){m--;d+=new Date(e.getFullYear(),e.getMonth(),0).getDate()}if(d>15)m++;return Math.min(12,Math.max(1,m))}
function fin(y){const f=fineC();return f?[P.inizioC,key(f)]:[y+'-01-01',y+'-12-31']}
function cf(y){const w=fin(y);return Object.keys(E).filter(k=>k>=w[0]&&k<=w[1]&&E[k].t==='ferie').length}
function prog(y){const t=key(new Date()),w=fin(y);return Object.keys(E).filter(k=>k>=w[0]&&k<=w[1]&&k>t&&E[k].t==='ferie').length}
function contrInfo(y){if(P.contratto!=='det'||!P.inizioC)return '';const f=fineC();if(!f)return '<div class="mu" style="margin-top:6px">Imposta la data di fine contratto in Profilo.</div>';const i=dIso(P.inizioC),fmt=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(),gg=Math.round((f-new Date(new Date().toDateString()))/864e5);return '<div class="mu" style="margin-top:8px">📄 Contratto a tempo determinato dal '+fmt(i)+' al '+fmt(f)+': '+mesiServ()+' mesi di servizio.'+(gg>=0?' Mancano '+gg+' giorni alla scadenza.':'')+'<br>Le ferie vanno godute entro la scadenza: se restano non fruite, il pagamento sostitutivo spetta solo se l’impossibilità non dipende da te (verifica con la segreteria).</div>'}

let txt='';for(let i=1;i<=Math.min(pdf.numPages,15);i++){const c=await(await pdf.getPage(i)).getTextContent();txt+='\n--- Pagina '+i+' ---\n'+c.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')}

st.textContent='L’IA sta estraendo i dati…';
const prompt='Sei un assistente che estrae timbrature e assenze da un cartellino orario (o documento simile) di un dipendente scolastico italiano. Oggi è '+key(new Date())+'. Se l’anno manca, usa quello più plausibile in base al documento.\nRestituisci SOLO un array JSON di oggetti {"data":"AAAA-MM-GG","causale":"<chiave>","timbrature":[["HH:MM","HH:MM"]],"ore104":numero oppure null}.\nChiavi causale: '+Object.keys(TIPI).map(k=>k+'='+TIPI[k]).join('; ')+'.\nRegole: "presenza" per i giorni lavorati, con gli intervalli ingresso/uscita; per ferie, malattia e altre assenze timbrature può essere vuoto; non inventare dati e salta i giorni senza informazioni.';
const r=await s.json(imgs?prompt:prompt+'\n\nDOCUMENTO:\n'+txt.slice(0,30000),imgs?{images:imgs}:{});
const arr=Array.isArray(r)?r:(r&&r.giornate)||[],out={};
arr.forEach(x=>{if(!x||!/^\d{4}-\d{2}-\d{2}$/.test(x.data))return;const t=TIPI[x.causale]?x.causale:'presenza';const p=(x.timbrature||[]).filter(a=>Array.isArray(a)&&nt(a[0])).map(a=>[nt(a[0]),nt(a[1])]);if(t==='presenza'&&!p.length)return;const e={t,p:t==='presenza'||t==='p104h'?p:[]};if(t==='p104h')e.hr=Math.min(2,+x.ore104||0);out[x.data]=e});
st.textContent='';if(!applyImp(out)){st.className='ko';st.textContent='Non ho trovato timbrature o assenze in questo PDF.'}
}catch(x){st.className='ko';st.textContent=x&&x.code==='not_granted'?'Permesso negato: senza consenso non posso usare l’IA.':'Non sono riuscito a leggere il PDF: '+((x&&x.message)||'riprova con un file più nitido')}finally{el.value=''}}
function parseImp(t){t=t.replace(/^\uFEFF/,'').trim();
if(t[0]==='{'){const o=JSON.parse(t),r={};Object.keys(o.e||{}).forEach(k=>{if(/^\d{4}-\d{2}-\d{2}$/.test(k))r[k]=o.e[k]});return r}
const out={};
t.split(/\r?\n/).forEach(l=>{let m=l.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/),d;
if(m)d=m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);else{m=l.match(/\d{4}-\d{2}-\d{2}/);if(!m)return;d=m[0]}
const rest=l.replace(m[0],''),low=rest.toLowerCase();
const ts=(rest.match(/\b(?:[01]?\d|2[0-3]):[0-5]\d(?::[0-5]\d)?\b/g)||[]).map(x=>{const a=x.split(':');return pad(+a[0])+':'+a[1]+':'+(a[2]||'00')});
let tipo='presenza';for(const k in TIPI){if(k!=='presenza'&&low.includes(TIPI[k].toLowerCase().split(' (')[0]))tipo=k}
const p=[];if(tipo==='presenza'||tipo==='p104h')for(let i=0;i<ts.length;i+=2)p.push([ts[i],ts[i+1]||'']);
if(tipo==='presenza'&&!p.length)return;
const e={t:tipo,p};if(tipo==='p104h')e.hr=0;out[d]=e});return out}

function prof(first){
 const p=P||{nome:'',cognome:'',profilo:'Collaboratore Scolastico',scuola:'',contratto:'ind',ore:36,giorni:5,anz:'gt3',res:0};
 const o=(v,a,l)=>`<option value="${v}" ${a==v?'selected':''}>${l}</option>`;
 return `<h1 class="ti">${IC.gear}${first?'Benvenuto! Configura il profilo':'Profilo e contratto'}</h1><div class="card">
 <label>Nome</label><input id="f_nome" value="${h(p.nome)}"><label>Cognome</label><input id="f_cognome" value="${h(p.cognome)}">
 <label>Profilo ATA</label><select id="f_profilo">${['Collaboratore Scolastico','Assistente Amministrativo','Assistente Tecnico','DSGA','Cuoco','Guardarobiere','Infermiere'].map(x=>o(x,p.profilo,x)).join('')}</select>
 <label>Scuola (opzionale)</label><input id="f_scuola" value="${h(p.scuola)}"><label>Plesso / sede (opzionale)</label><input id="f_plesso" value="${h(p.plesso||'')}"><div class="mu" style="margin:-4px 0 10px">Nomi ufficiali di scuole e plessi: <a href="https://dati.istruzione.it/opendata/opendata/catalogo/elements1/leaf/?datasetId=DS0400SCUANAGRAFESTAT" target="_blank" rel="noopener" style="color:var(--pr)">elenco del Ministero</a>. Nell’app Android la ricerca è automatica.</div>
 <label>Contratto</label><select id="f_contratto" onchange="contrUi(this.value)">${o('ind',p.contratto,'Tempo indeterminato')}${o('det',p.contratto,'Tempo determinato')}</select>
 <div id="bx_det" style="${p.contratto==='det'?'':'display:none'}"><label>Scadenza del contratto</label><select id="f_scadC" onchange="document.getElementById('bx_fineC').style.display=this.value==='altra'?'':'none'">${o('30giu',p.scadC||'30giu','30 giugno (fino al termine delle attività didattiche)')}${o('31ago',p.scadC||'30giu','31 agosto (fino al termine dell’anno scolastico)')}${o('altra',p.scadC||'30giu','Altra data')}</select><label>Data di inizio del contratto</label><input id="f_inizioC" type="date" value="${p.inizioC||''}"><div id="bx_fineC" style="${(p.scadC||'30giu')==='altra'?'':'display:none'}"><label>Data di fine del contratto</label><input id="f_fineC" type="date" value="${p.fineC||''}"></div></div>
 <label>Tipo di orario</label><select id="f_tipo" onchange="tipoUi(this.value)">${o('pieno',p.tipoOrario||'pieno','Tempo pieno')}${o('orizz',p.tipoOrario||'pieno','Part-time orizzontale (tutti i giorni, meno ore)')}${o('vert',p.tipoOrario||'pieno','Part-time verticale (solo alcuni giorni)')}${o('pers',p.tipoOrario||'pieno','Personalizzato (ore diverse per giorno)')}</select>
 <div id="bx_ore" style="${p.tipoOrario==='pers'?'display:none':''}"><label>Ore settimanali (36 = tempo pieno)</label><input id="f_ore" type="number" min="1" max="36" step="0.5" value="${p.ore}"></div>
 <div id="bx_sett" style="${p.tipoOrario==='vert'||p.tipoOrario==='pers'?'display:none':''}"><label>Settimana</label><select id="f_giorni">${o(5,p.giorni,'Corta: 5 giorni (Lun–Ven)')}${o(6,p.giorni,'Lunga: 6 giorni (Lun–Sab)')}</select></div>
 <div id="bx_vert" style="${p.tipoOrario==='vert'?'':'display:none'}"><label>Giorni in cui lavori (le ore si dividono tra questi)</label><div style="margin-bottom:10px">${['L','M','M','G','V','S'].map((n,i)=>`<label style="display:inline-block;margin-right:12px;color:var(--tx);font-size:15px"><input type="checkbox" class="gl" value="${i+1}" style="width:auto;margin:0 4px 0 0" ${(p.giorniLav||[1,2,3,4,5]).includes(i+1)?'checked':''}>${n}</label>`).join('')}</div></div>
 <div id="bx_pers" style="${p.tipoOrario==='pers'?'':'display:none'}"><label>Ore per giorno, da lunedì a sabato (0 = giorno libero)</label><div>${['Lun','Mar','Mer','Gio','Ven','Sab'].map((n,i)=>`<input class="og" type="number" step="0.25" min="0" max="12" placeholder="${n}" value="${(p.oreGiorno&&p.oreGiorno[i]!=null)?p.oreGiorno[i]:''}" style="width:15%;display:inline-block;margin:0 2px 8px 0;padding:8px 4px">`).join('')}</div></div>
 <label>Mesi di servizio in quest’anno (12 = tutto l’anno; per assunzione o cessazione)</label><input id="f_mesiAnno" type="number" min="1" max="12" value="${p.mesiAnno||12}">
 <label>Giorni di festività soppresse (CCNL: 3 dal 2026)</label><input id="f_festSopp" type="number" min="0" value="${p.festSopp==null?3:p.festSopp}">
 <label>Giorni di ferie annuali (vuoto = calcolo automatico)</label><input id="f_ferieMan" type="number" min="0" value="${p.ferieMan==null?'':p.ferieMan}">
 <label>Anzianità di servizio</label><select id="f_anz">${o('lt3',p.anz,'Meno di 3 anni')}${o('gt3',p.anz,'Oltre 3 anni')}</select>
 <label>Ferie residue anno precedente (giorni)</label><input id="f_res" type="number" min="0" value="${p.res}">
 <h2 style="margin-top:8px">Permessi e congedi (da abilitare)</h2>
 <label>👨‍👩‍👧 Ferie e permessi per motivi familiari</label><select id="f_fam">${o(0,p.fam?1:0,'Disattivato')}${o(1,p.fam?1:0,'Attivo')}</select>
 <label>Giorni di ferie per motivi familiari/personali (CCNL: 6)</label><input id="f_famMax" type="number" min="0" value="${p.famMax||6}">
 <label>Permessi retribuiti personali/familiari (CCNL: 3)</label><input id="f_permMax" type="number" min="0" value="${p.permMax||3}">
 <label>♿ Permessi Legge 104 (3 giorni al mese)</label><select id="f_f104">${o(0,p.f104?1:0,'Disattivato')}${o(1,p.f104?1:0,'Attivo')}</select>
 <label>🍼 Congedo parentale (figli fino a 12 anni)</label><select id="f_cong">${o(0,p.cong?1:0,'Disattivato')}${o(1,p.cong?1:0,'Attivo')}</select>
 <label>Mesi di congedo parentale fruibili (di norma 10)</label><input id="f_congMax" type="number" min="0" step="0.5" value="${p.congMax||10}">
 <div class="mu" style="margin-bottom:10px">I limiti sono modificabili: verificali con la segreteria o il sindacato, perché dipendono dalla tua situazione.</div>
 <h2 style="margin-top:8px">🎨 Aspetto</h2>
 <label>Colore dell’app</label><select id="f_tema" onchange="if(P){P.tema=this.value;applyTema()}">${o('viola',p.tema||'viola','Viola')}${o('blu',p.tema||'viola','Blu')}${o('verde',p.tema||'viola','Verde')}${o('arancio',p.tema||'viola','Arancio')}</select>
 <label>Tema</label><select id="f_modo" onchange="if(P){P.modo=this.value;applyTema()}">${o('auto',p.modo||'auto','Automatico')}${o('chiaro',p.modo||'auto','Chiaro')}${o('scuro',p.modo||'auto','Scuro')}</select>
 <h2 style="margin-top:8px">📆 Ferie, banca ore e figli</h2>
 <label>Scadenza ferie residue (gg/mm)</label><input id="f_scadRes" value="${h(p.scadRes||'30/04')}">
 <label>Mesi di validità dei crediti orari (0 = nessuna scadenza)</label><input id="f_bancaMesi" type="number" min="0" value="${p.bancaMesi||0}">
 <label>Nomi dei figli per il congedo parentale (separati da virgola)</label><input id="f_figli" value="${h(p.figli||'')}">
 <h2 style="margin-top:8px">⏰ Promemoria timbratura</h2>
 <label>Promemoria</label><select id="f_rem">${o(0,p.rem?1:0,'Disattivato')}${o(1,p.rem?1:0,'Attivo')}</select>
 <label>Orario ingresso</label><input id="f_remIn" type="time" value="${p.remIn||'07:30'}">
 <label>Orario uscita</label><input id="f_remOut" type="time" value="${p.remOut||'14:00'}">
 <button class="sec" style="margin-bottom:8px" onclick="try{Notification.requestPermission().then(r=>alert(r==='granted'?'Notifiche attivate':'Notifiche non consentite'))}catch(x){alert('Notifiche non disponibili qui')}">🔔 Consenti notifiche</button>
 <div class="mu" style="margin-bottom:10px">Il promemoria funziona con l’app aperta. Per avvisi a schermo spento usa una sveglia del telefono o l’app Android.</div>
 <button onclick="saveP()">${first?'Inizia':'Salva'}</button>${first?'':bk()+im()+inf()}</div>
 ${first?'':'<button class="sec" onclick="if(confirm(\'Cancellare tutti i dati?\')){E={};sv(\'ata_e\',E);render()}">Cancella tutte le timbrature</button><div class="mu" style="margin-top:10px">I dati restano solo su questo dispositivo, nel browser.</div>'}`
}
function saveP(){const g=i=>document.getElementById('f_'+i).value;
 if(!g('nome').trim()){alert('Inserisci il nome');return}
 P={nome:g('nome').trim(),cognome:g('cognome').trim(),profilo:g('profilo'),scuola:g('scuola').trim(),plesso:g('plesso').trim(),contratto:g('contratto'),scadC:g('scadC'),inizioC:g('inizioC'),fineC:g('fineC'),ore:g('tipo')==='pers'?([...document.querySelectorAll('.og')].reduce((a,x)=>a+(+x.value||0),0)||36):(+g('ore')||36),giorni:+g('giorni'),tipoOrario:g('tipo'),giorniLav:[...document.querySelectorAll('.gl:checked')].map(x=>+x.value),oreGiorno:[...document.querySelectorAll('.og')].map(x=>+x.value||0),ferieMan:g('ferieMan').trim()===''?null:+g('ferieMan'),mesiAnno:+g('mesiAnno')||12,festSopp:g('festSopp')===''?3:+g('festSopp'),anz:g('anz'),res:+g('res')||0,fam:+g('fam'),famMax:+g('famMax')||6,permMax:+g('permMax')||3,f104:+g('f104'),cong:+g('cong'),congMax:+g('congMax')||10,rem:+g('rem'),remIn:g('remIn')||'07:30',remOut:g('remOut')||'14:00',scadRes:g('scadRes').trim()||'30/04',bancaMesi:+g('bancaMesi')||0,figli:g('figli').trim(),guida:P&&P.guida,tema:g('tema'),modo:g('modo')};
 sv('ata_p',P);view='home';render()}
setInterval(()=>{try{const r=document.getElementById('ring');if(r&&view==='home'&&P)r.outerHTML=ringHtml()}catch(x){}},1000);
window._n={};setInterval(()=>{try{const b=P&&banner();const k=key(new Date())+b;if(b&&window.Notification&&Notification.permission==='granted'&&!window._n[k]){window._n[k]=1;new Notification('ATA Agenda',{body:b})}if(view==='home'&&!document.getElementById('modal'))render()}catch(x){}},60000);
render();

(function(){try{const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),sa=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;if(ios&&!sa&&!localStorage.getItem('ata_inst')){const d=document.createElement('div');d.id='inst';d.innerHTML='<b>Installa l\u2019app sul telefono</b><br>Tocca <b>Condividi</b> (il quadrato con la freccia) e poi <b>Aggiungi a schermata Home</b>.<br><button class="sec sm" id="instok">Ho capito</button>';document.body.insertBefore(d,document.body.firstChild);document.getElementById('instok').onclick=function(){d.remove();localStorage.setItem('ata_inst','1')}}}catch(e){}})();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(function(){});
</script>
</body>
</html>
